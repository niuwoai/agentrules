name: Release AI rule artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同 tag 的重试互斥；不同版本可并行准备和分发，不在此流程推进共享 Latest。
concurrency:
  group: rule-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Generate and publish CLAUDE.md and AGENTS.md
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Verify release source and version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main
          RELEASE_COMMIT="$(git rev-list -n1 "refs/tags/$TAG_NAME")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          ruby scripts/verify_rules.rb --expected-version "$TAG_NAME" --json-output tmp/release-verification.json --markdown-output tmp/release-verification.md

      - name: Generate final rule artifacts
        run: |
            ruby scripts/generate_claude_md.rb --all --index --output CLAUDE.md --force
            ruby scripts/generate_claude_md.rb --all --index --output AGENTS.md --force

      - name: Distribute and verify immutable rule artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag --draft --latest=false --title "$TAG_NAME" --generate-notes
          fi
          IS_DRAFT="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
          DOWNLOAD_DIR="$(mktemp -d)"
          for ARTIFACT in CLAUDE.md AGENTS.md; do
            EXISTS="$(gh release view "$TAG_NAME" --json assets --jq ".assets | any(.name == \"$ARTIFACT\")")"
            if [ "$EXISTS" = "false" ]; then
              if [ "$IS_DRAFT" != "true" ]; then
                printf 'Published release is missing required artifact: %s\n' "$ARTIFACT" >&2
                exit 1
              fi
              gh release upload "$TAG_NAME" "$ARTIFACT"
            fi
            gh release download "$TAG_NAME" --pattern "$ARTIFACT" --dir "$DOWNLOAD_DIR"
            cmp "$ARTIFACT" "$DOWNLOAD_DIR/$ARTIFACT"
          done
          if [ "$IS_DRAFT" = "true" ]; then
            gh release edit "$TAG_NAME" --draft=false --latest=false
          fi
          test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = "false"
